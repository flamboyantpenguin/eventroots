---
name: Build Soul Edge
"on":
  push:
    branches:
      - master
    paths:
      - "backend/**"
      - "!backend/README.md"
      - "!backend/.gitignore"
      - ".github/workflows/build-backend-edge.yaml"
  workflow_dispatch: {}

jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ vars.maintainer }}
          password: ${{ secrets.TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: ghcr.io/flamboyantpenguin/eventroots/soul:edge
          platforms: linux/amd64,linux/arm64
