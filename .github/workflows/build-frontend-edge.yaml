---
name: Build Persona Edge
"on":
  push:
    branches:
      - master
    paths:
      - "frontend/**"
      - "!frontend/README.md"
      - "!frontend/.gitignore"
      - "!frontend/bun.lock"
      - ".github/workflows/build-frontend-edge.yaml"
  workflow_dispatch: {}

jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: ./frontend/Containerfile
          push: true
          tags: ghcr.io/flamboyantpenguin/eventroots/persona:edge
          platforms: linux/amd64,linux/arm64
